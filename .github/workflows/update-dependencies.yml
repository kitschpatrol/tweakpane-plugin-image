name: Update Dependencies

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 1 * *'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm ci

      - name: Run ksc-update
        uses: kitschpatrol/github-action-skill-to-pr@48d00903336a00458c6c608cc3f3d6b99d4f69c7 # v1.2.1
        with:
          skill: ksc-update
          title: Update dependencies.
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          model: claude-opus-5-5
          effort: high
          max-turns: 400
          instructions: |
            Scope
            - Known consumers: Tweakpane 4 apps installing from npm, CDN users loading jsdelivr URLs, and svelte-tweakpane-ui, which imports the /lite entry and its public types.
            - This package is a fork of https://github.com/metehus/tweakpane-image-plugin. Keep its plugin behavior, bundle id, view names, and parameter names.

            Tweakpane compatibility
            This is a Tweakpane 4 plugin. Treat the following as contracts: defer any change to them for human review.
            - Keep @tweakpane/core in dependencies at ^2 and the tweakpane peer at ^4.0.0. Tweakpane refuses to register a plugin whose core major differs from its own (core 2 for Tweakpane 4). Do not move @tweakpane/core to devDependencies: the lite builds and the published types import it.
            - Keep the four package-named builds directly in dist/: .js and .min.js bundle @tweakpane/core, and .lite.js and .lite.min.js import it. Keep exactly three exports: the root (.js), /lite (.lite.js), and /package.json, sharing one bundled .d.ts with core and Tweakpane types external. Re-export public types from src/index.ts.
            - After every build, confirm:
              - the bundled builds have no import statements and embed the core version as Semver 2.x.y;
              - the lite builds import only "@tweakpane/core";
              - the module still exports id, css, plugins, and the public types listed in src/index.ts, with the id and view names unchanged.
            - Shipped JavaScript must stay within ES2022 for browsers.
              - Do not change tsdown's target or platform.
              - tsdown lowers syntax but does not polyfill APIs. The ES2022 TypeScript lib catches newer APIs in this package's source, not in bundled dependencies.
              - If a lint autofix introduces anything newer than ES2022, revert it and turn the rule off with a reason in eslint.config.ts. Examples: the regex v flag, toSorted/toReversed/with, findLast, Object.groupBy, Set methods, iterator helpers, Promise.withResolvers.
              - Keep the require-unicode-regexp override.
            - Keep tsdown and @tsdown/css on the same version while tsdown's CSS support is experimental. Styles compile from src/styles through a ?inline import, and Tweakpane installs the exported css string at registration.
            - Keep sass on 1.x and use quietDeps only for dependency Sass deprecations. Those deprecations come from @tweakpane/core's legacy Sass helpers. Report any new Sass warning.
            - Keep typescript within the peer ranges of @kitschpatrol/typescript-config and typescript-eslint.
            - Diff the four dist bundles and the .d.ts against the baseline build.
              - Minifier-level changes from tsdown or rolldown updates are expected.
              - The embedded CSS string should change only with a reviewed Sass, @tsdown/css or Lightning CSS update.
              - The types should change only with a reviewed TypeScript or tsdown update.
              - Explain everything else.

            Validation
            - mdat generates the readme size table from dist, so run pnpm build before pnpm fix and pnpm lint.
            - Pack the build. In an isolated fixture with tweakpane and @tweakpane/core installed, import both entry points (the package root and /lite), register each with a Pane under happy-dom, and compare the exports and bundle id against the published release.
            - If the runner has a Chromium-based browser, load the bundled and lite builds next to Tweakpane 4.0.0 and the latest 4.x, call pane.registerPlugin, and exercise each view. Otherwise report the browser check as not run.
